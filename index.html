    // 🏆 100 題完整題庫 (植物大發現 - 50是非 + 50選擇)

      // 是非題 1-50
      { id: 1, type: 'TF', text: '用手觸摸樹幹，可以感覺到樹皮是粗糙還是平滑的，這是運用觸覺觀察。', options: ['⭕ 對', '❌ 錯'], correctIndex: 0, explanation: '莖摸起來有點粗糙，這是運用手觸摸的觸覺觀察。[cite: 1]' },

      { id: 3, type: 'TF', text: '我們可以用眼睛觀察植物，例如看看花朵是什麼顏色、植物具有哪些構造。', options: ['⭕ 對', '❌ 錯'], correctIndex: 0, explanation: '用眼睛觀察可以看見植物的構造顏色或大小等特徵。[cite: 1]' },
      { id: 4, type: 'TF', text: '植物的身體通常分為根、莖、葉、花、果實、種子等基本構造。', options: ['⭕ 對', '❌ 錯'], correctIndex: 0, explanation: '植物的基本構造包含：根、莖、葉、花、果實、種子。[cite: 1]' },
      { id: 5, type: 'TF', text: '每一種植物一定都會長得非常高大，並且具有極大的果實。', options: ['⭕ 對', '❌ 錯'], correctIndex: 1, explanation: '不同植物的基本構造大小與外觀皆不相同，例如草本莖通常較為細小、低矮。[cite: 2]' },
      { id: 6, type: 'TF', text: '葉子通常由「葉片」和「葉柄」兩部分組成。', options: ['⭕ 對', '❌ 錯'], correctIndex: 0, explanation: '葉子包含了葉片及葉柄。[cite: 1, 4]' },
      { id: 7, type: 'TF', text: '植物的葉片通常是圓柱狀的，這樣可以減少陽光照射的面積。', options: ['⭕ 對', '❌ 錯'], correctIndex: 1, explanation: '葉片通常為扁平狀，有利於增加陽光照射面積。[cite: 1, 4]' },
      { id: 8, type: 'TF', text: '觀察葉片時，可以從「葉形」、「葉緣」和「葉脈」三個主要構造來分類。', options: ['⭕ 對', '❌ 錯'], correctIndex: 0, explanation: '葉片的主要構造可分為：葉形、葉緣、葉脈。[cite: 1]' },

      { id: 10, type: 'TF', text: '番石榴的葉脈看起來像網子一樣交錯排列，我們稱為「網狀脈」。', options: ['⭕ 對', '❌ 錯'], correctIndex: 0, explanation: '番石榴具有平滑狀的葉緣與網狀脈。[cite: 1]' },

      { id: 12, type: 'TF', text: '每一種植物的葉子在節上排列的方式（葉序）都是完全一樣的。', options: ['⭕ 對', '❌ 錯'], correctIndex: 1, explanation: '葉子在節上不同的排列方式稱葉序，分為互生、對生、輪生等。[cite: 2, 4]' },

      { id: 14, type: 'TF', text: '楓香的葉子在節上是「對生」的排列方式，會兩片兩片相對長出來。', options: ['⭕ 對', '❌ 錯'], correctIndex: 1, explanation: '楓香的葉序屬於「互生」。[cite: 2, 4]' },
      { id: 15, type: 'TF', text: '黑板樹的一個節上會長出三片或三片以上的葉子，這種生長方式叫做「輪生」。', options: ['⭕ 對', '❌ 錯'], correctIndex: 0, explanation: '輪生是1個節上有3片或以上的葉子，例如黑板樹。[cite: 2, 4]' },
      { id: 16, type: 'TF', text: '植物的莖具有支撐植物身體的功能，可以讓植物爭取陽光。', options: ['⭕ 對', '❌ 錯'], correctIndex: 0, explanation: '植物的莖具有支撐植物身體、讓植物爭取陽光的功能。[cite: 2, 4]' },

      { id: 21, type: 'TF', text: '植物的根主要分為「軸根」和「鬚根」兩大類。', options: ['⭕ 對', '❌ 錯'], correctIndex: 0, explanation: '植物的根分為軸根和鬚根。[cite: 2]' },
      { id: 22, type: 'TF', text: '植物根部最重要的功能是吸收陽光並製造養分。', options: ['⭕ 對', '❌ 錯'], correctIndex: 1, explanation: '根有固定植物和吸收土壤裡水分和養分的功能。[cite: 2]' },

      { id: 24, type: 'TF', text: '水稻和青蔥的根看起來細小且像鬍鬚，生長在土壤淺層，這種根稱為「鬚根」。', options: ['⭕ 對', '❌ 錯'], correctIndex: 0, explanation: '鬚根細小且像鬍鬚的小根，生長在土壤淺層，例：水稻、蔥、蒜。[cite: 2, 5]' },
      { id: 25, type: 'TF', text: '遇到強風時，植物的根可以緊緊抓住土壤，把植物固定住。', options: ['⭕ 對', '❌ 錯'], correctIndex: 0, explanation: '根有固定植物的功能。[cite: 2]' },
      { id: 26, type: 'TF', text: '所有植物的花，都必定同時擁有花萼、花瓣、雄蕊和雌蕊四個部分，稱為完全花。', options: ['⭕ 對', '❌ 錯'], correctIndex: 1, explanation: '大部分花具有這四個構造稱為完全花，若缺少其中一項則稱為不完全花。[cite: 3]' },

      { id: 28, type: 'TF', text: '如果一朵花缺少了花瓣，我們就稱它為「不完全花」。', options: ['⭕ 對', '❌ 錯'], correctIndex: 0, explanation: '若缺少了其中一項則稱為不完全花。[cite: 3]' },

      { id: 33, type: 'TF', text: '植物開花授粉之後會結出果實，果實裡面通常會包著種子。', options: ['⭕ 對', '❌ 錯'], correctIndex: 0, explanation: '植物開花授粉後會結出果實，果實裡面有種子。[cite: 3, 5]' },

      return '花、果實、種子與功用';
    };

    // 隨機打亂題目選項 (不影響是非題)
    const getShuffledQuestion = (q) => {
      if (q.type === 'TF') return { ...q };

      let shuffledItems = q.options.map((opt, idx) => ({
        text: opt,
        isCorrect: idx === q.correctIndex
      }));

      for (let i = shuffledItems.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [shuffledItems[i], shuffledItems[j]] = [shuffledItems[j], shuffledItems[i]];
      }

      return {
        ...q,
        options: shuffledItems.map(item => item.text),
        correctIndex: shuffledItems.findIndex(item => item.isCorrect)
      };
    };

    function App() {
      const [gameState, setGameState] = useState('intro'); 
      const [position, setPosition] = useState(0);
      const [coins, setCoins] = useState(0); 
      const [inventory, setInventory] = useState([]); 
      const [diceResult, setDiceResult] = useState(null);
      const [isRolling, setIsRolling] = useState(false);
      const [isWalking, setIsWalking] = useState(false); 
      
      const [currentQuestion, setCurrentQuestion] = useState(null);
      const [chanceEvent, setChanceEvent] = useState(null);
      const [answerResult, setAnswerResult] = useState(null); 
      const [message, setMessage] = useState('點擊地圖中央的「擲骰子」開始你的自然探險！');
      
      const [history, setHistory] = useState([]);
      const [availableQuestionIds, setAvailableQuestionIds] = useState([]);
      const [hasPromptedShop, setHasPromptedShop] = useState(false);
      const [showShopPrompt, setShowShopPrompt] = useState(false);

      // 初始化不重複題庫陣列
      useEffect(() => {
        const ids = QUESTION_BANK.map(q => q.id);
        for (let i = ids.length - 1; i > 0; i--) {
          const j = Math.floor(Math.random() * (i + 1));
          [ids[i], ids[j]] = [ids[j], ids[i]];
        }
        setAvailableQuestionIds(ids);
      }, []);

      // 檢查是否達到破關金額 250
      useEffect(() => {
        if (gameState === 'playing' && coins >= 250 && !hasPromptedShop && inventory.length < 5) {
          setShowShopPrompt(true);
          setHasPromptedShop(true);
        }
      }, [coins, gameState, hasPromptedShop, inventory.length]);

      const getCellGridStyle = (index) => {
        if (index >= 0 && index <= 9) return { gridColumn: index + 1, gridRow: 1 };
        if (index >= 10 && index <= 12) return { gridColumn: 10, gridRow: index - 8 };
        if (index >= 13 && index <= 22) return { gridColumn: 23 - index, gridRow: 5 };
        if (index >= 23 && index <= 25) return { gridColumn: 1, gridRow: 27 - index };
        return {};
      };

      const rollDice = () => {
        if (isRolling || isWalking || currentQuestion || chanceEvent || gameState === 'won' || showShopPrompt) return;
        
        setIsRolling(true);
        setMessage('🎲 擲骰子中...');
        
        let rollCount = 0;
        const rollInterval = setInterval(() => {
          setDiceResult(Math.floor(Math.random() * 3) + 1);
          rollCount++;
          
          if (rollCount > 10) {
            clearInterval(rollInterval);
            const finalRoll = Math.floor(Math.random() * 3) + 1;
            setDiceResult(finalRoll);
            setIsRolling(false);
            startWalking(finalRoll, position);
          }
        }, 80);
      };

      const startWalking = (steps, startPos) => {
        setIsWalking(true);
        setMessage(`前進 ${steps} 步！🏃‍♂️`);

        let finalPos = (startPos + steps) % 26;
        let passStartBonus = (startPos + steps >= 26);

        let stepCount = 0;
        const walkInterval = setInterval(() => {
          stepCount++;
          setPosition(prev => (prev + 1) % 26);

          if (stepCount >= steps) {
            clearInterval(walkInterval);
            setIsWalking(false);
            handleLanding(finalPos, passStartBonus);
          }
        }, 350); 
      };

      const handleLanding = (pos, passStartBonus) => {
        const cell = CELL_MAP[pos];
        const prefixMsg = passStartBonus ? '✅ 經過起點，獲得 10 金幣鼓勵！\n' : '';

        if (passStartBonus) {
          setCoins(prev => prev + 10);
        }

        if (cell.type === 'START') {
          setMessage(prefixMsg + '抵達起點！休息一下準備再出發。');
        } else if (cell.type === 'CHANCE') {
          const event = CHANCE_EVENTS[Math.floor(Math.random() * CHANCE_EVENTS.length)];
          setChanceEvent(event);
          setMessage(prefixMsg + '遇到機會命運了！看看發生什麼事？');
        } else if (cell.type === 'QUESTION') {
          let nextId = availableQuestionIds[0];
          let newAvailableIds = availableQuestionIds.slice(1);
          
          if (!nextId) {
            const ids = QUESTION_BANK.map(q => q.id).sort(() => Math.random() - 0.5);
            nextId = ids[0];
            newAvailableIds = ids.slice(1);
          }
          
          setAvailableQuestionIds(newAvailableIds);
          const rawQ = QUESTION_BANK.find(q => q.id === nextId);
          setCurrentQuestion(getShuffledQuestion(rawQ));
          setMessage(prefixMsg + '進入隨堂考區域！答對問題賺取 10 金幣！');
        }
      };

      const handleAnswer = (selectedIndex) => {
        const isCorrect = selectedIndex === currentQuestion.correctIndex;
        const correctOptionText = currentQuestion.options[currentQuestion.correctIndex];
        
        setHistory(prev => [...prev, { ...currentQuestion, isCorrect }]);

        if (isCorrect) {
          setCoins(prev => prev + 10);
        }
        
        setAnswerResult({
          isCorrect,
          correctAnswer: correctOptionText,
          explanation: currentQuestion.explanation,
          coinsEarned: isCorrect ? 10 : 0
        });
        
        setCurrentQuestion(null);
      };

      const closeAnswerResult = () => {
        if (answerResult.isCorrect) {
          setMessage('太棒了！你的知識為你賺取了探險基金！繼續前進吧。');
        } else {
          setMessage('不要灰心，繼續擲骰子挑戰下一題！');
        }
        setAnswerResult(null);
      };

      const handleChanceClose = () => {
        if (chanceEvent) {
          setCoins(prev => Math.max(0, prev + chanceEvent.coins)); 
          setMessage(chanceEvent.coins > 0 ? '運氣真好！賺到額外金幣了！' : '哎呀！破財消災，下次會更好。');
          setChanceEvent(null);
        }
      };

      const buySupply = (item) => {
        if (coins >= item.cost) {
          setCoins(prev => prev - item.cost);
          const newInventory = [...inventory, item.id];
          setInventory(newInventory);
          
          if (newInventory.length === EXPLORATION_SUPPLIES.length) {
            setGameState('won');
          } else {
            setMessage(`🛒 成功購買 ${item.name}！繼續收集下一個物資吧！`);
          }
        }
      };

      if (gameState === 'intro') {
        return (
          <div className="h-full w-full bg-gradient-to-b from-green-50 to-green-200 flex flex-col items-center justify-center p-6 text-gray-800">
            <div className="max-w-4xl w-full bg-white rounded-3xl shadow-2xl overflow-hidden animate-zoom-in border-t-8 border-green-500 flex flex-col max-h-full">
              <div className="bg-green-600 text-white py-6 px-8 text-center relative flex-shrink-0">
                <h1 className="text-3xl md:text-5xl font-black mb-2 relative z-10 tracking-wider">🌿 自然探險大富翁 🌸</h1>
                <p className="text-lg md:text-xl font-bold opacity-90 relative z-10">百題無死角！三年級：植物大發現</p>
              </div>

              <div className="p-8 overflow-y-auto no-scrollbar">
                <h2 className="text-2xl font-black text-green-800 mb-6 flex items-center border-b-4 border-green-200 pb-2">
                  📜 遊戲玩法
                </h2>
                
                <div className="grid grid-cols-1 md:grid-cols-2 gap-4 text-base font-medium text-gray-700">
                  <div className="flex items-start bg-green-50 p-4 rounded-xl border border-green-100 shadow-sm">
                    <span className="text-2xl mr-3">🎲</span>
                    <div>
                      <h3 className="font-bold text-green-800">擲骰子前進 (1~3點)</h3>
                      <p className="text-sm">點擊地圖中央骰子穩步前進尋找植物。</p>
                    </div>
                  </div>

                  <div className="flex items-start bg-yellow-50 p-4 rounded-xl border border-yellow-100 shadow-sm">
                    <span className="text-2xl mr-3">💰</span>
                    <div>
                      <h3 className="font-bold text-yellow-800">答題賺金幣</h3>
                      <p className="text-sm">走到「隨堂考」答對問題獲得 <strong>10 金幣</strong>！</p>
                    </div>
                  </div>

                  <div className="flex items-start bg-purple-50 p-4 rounded-xl border border-purple-100 shadow-sm">
                    <span className="text-2xl mr-3">🎁</span>
                    <div>
                      <h3 className="font-bold text-purple-800">機會命運</h3>
                      <p className="text-sm">遇到好玩有趣的自然植物生態事件。</p>
                    </div>
                  </div>

                  <div className="flex items-start bg-indigo-50 p-4 rounded-xl border border-indigo-100 shadow-sm">
                    <span className="text-2xl mr-3">🏆</span>
                    <div>
                      <h3 className="font-bold text-indigo-800">破關目標</h3>
                      <p className="text-sm">存滿 <strong>250 金幣</strong>並買齊五樣植物探險裝備！</p>
                    </div>
                  </div>
                </div>

                <div className="mt-8 text-center pb-4">
                  <button 
                    onClick={() => setGameState('playing')}
                    className="px-10 py-4 bg-gradient-to-r from-green-500 to-green-600 text-white font-black text-xl rounded-full shadow-xl hover:scale-105 hover:shadow-2xl transition-all transform active:scale-95"
                  >
                    🚀 出發探索植物
                  </button>
                </div>
              </div>
            </div>
          </div>
        );
      }

      if (gameState === 'won') {
        const totalAnswered = history.length;
        const correctCount = history.filter(h => h.isCorrect).length;
        const accuracy = totalAnswered > 0 ? Math.round((correctCount / totalAnswered) * 100) : 0;
        const wrongQuestions = history.filter(h => !h.isCorrect);

        return (
          <div className="h-full w-full bg-green-50 flex justify-center items-center p-4">
            <div className="max-w-5xl w-full h-full bg-white rounded-[2rem] shadow-2xl flex flex-col animate-zoom-in overflow-hidden">
              
              <div className="bg-gradient-to-r from-green-600 to-emerald-700 text-white py-6 px-10 text-center flex-shrink-0">
                <h1 className="text-3xl md:text-4xl font-black mb-2 tracking-widest drop-shadow-md">
                  🏆 植物探險家 結業報告
                </h1>
                <p className="text-lg font-medium opacity-90">
                  恭喜買齊裝備！下滑閱讀你的專屬成績單與「必考重點總複習」。
                </p>
              </div>

              <div className="flex-1 overflow-y-auto no-scrollbar p-6 md:p-10 space-y-10">
                
                <section>
                  <h2 className="text-xl font-black text-gray-800 border-l-8 border-yellow-400 pl-4 mb-4">📊 探險作答數據</h2>
                  <div className="grid grid-cols-3 gap-4 text-center">
                    <div className="bg-blue-50 py-4 rounded-2xl border border-blue-100 shadow-sm">
                      <div className="text-gray-500 font-bold text-sm">總挑戰題數</div>
                      <div className="text-4xl font-black text-blue-600">{totalAnswered}</div>
                    </div>
                    <div className="bg-green-50 py-4 rounded-2xl border border-green-100 shadow-sm">
                      <div className="text-gray-500 font-bold text-sm">答對題數</div>
                      <div className="text-4xl font-black text-green-600">{correctCount}</div>
                    </div>
                    <div className="bg-orange-50 py-4 rounded-2xl border border-orange-100 shadow-sm">
                      <div className="text-gray-500 font-bold text-sm">知識正確率</div>
                      <div className="text-4xl font-black text-orange-500">{accuracy}%</div>
                    </div>
                  </div>
                </section>

                <section>
                  <h2 className="text-xl font-black text-gray-800 border-l-8 border-indigo-500 pl-4 mb-4">🤖 弱點診斷與錯題回顧</h2>
                  {wrongQuestions.length === 0 ? (
                    <div className="bg-gradient-to-r from-yellow-100 to-yellow-50 text-yellow-800 font-black p-6 rounded-2xl text-center text-xl border border-yellow-200 shadow-inner">
                      🌟 滿分通關！太完美了！請直接享用下方的重點總複習！
                    </div>
                  ) : (
                    <div className="space-y-4">
                      {wrongQuestions.map((q, idx) => (
                        <div key={idx} className="bg-white border border-red-200 p-5 rounded-2xl shadow-sm">
                          <p className="font-bold text-gray-800 text-lg mb-2">Q: {q.text}</p>
                          <div className="text-green-700 font-black bg-green-50 inline-block px-3 py-1 rounded-lg border border-green-200 mb-2 text-sm">
                            ✔️ 正確答案：{q.options[q.correctIndex]}
                          </div>
                          <div className="text-gray-600 text-sm font-medium bg-gray-50 p-3 rounded-xl border-l-4 border-gray-400">
                            💡 解析：{q.explanation}
                          </div>
                        </div>
                      ))}
                    </div>
                  )}
                </section>

                <section>
                  <h2 className="text-2xl font-black text-gray-800 border-l-8 border-emerald-500 pl-4 mb-6">📖 考前必讀：超詳細單元總複習</h2>

                  <div className="bg-white rounded-2xl border border-emerald-200 shadow-md mb-6 overflow-hidden">
                    <div className="bg-emerald-500 text-white py-3 px-5">
                      <h3 className="text-xl font-black">🌿 單元一：植物的構造 (根、莖、葉)</h3>
                    </div>
                    <div className="p-6 space-y-6 text-gray-800">
                      <div>
                        <h4 className="text-lg font-bold text-emerald-800 mb-2 border-b border-emerald-100 pb-1">1. 植物的基本與葉子</h4>
                        <p className="text-sm font-medium mb-2">植物基本構造：根、莖、葉、花、果實、種子。觀察方式包含視覺、觸覺、嗅覺。</p>
                        <ul className="text-sm space-y-2 bg-emerald-50 p-3 rounded-lg">
                          <li><strong>葉片特徵：</strong>呈扁平狀(增加陽光照射)。特徵分：葉形(心形/卵形)、葉緣(平滑/鋸齒)、葉脈(網狀/平行)。</li>
                          <li><strong>葉序(葉在節上排列)：</strong>互生(1片, 楓香)、對生(2片, 番石榴)、輪生(3片以上, 黑板樹)。</li>
                        </ul>
                      </div>
                      <div>
                        <h4 className="text-lg font-bold text-emerald-800 mb-2 border-b border-emerald-100 pb-1">2. 莖與根的種類</h4>
                        <ul className="text-sm space-y-2 bg-gray-50 p-3 rounded-lg">
                          <li><strong>莖(支撐、爭取陽光)：</strong>木本莖(粗壯直立,樟樹)、草本莖(細小直立,昭和草)、藤本莖(柔軟攀附,牽牛花)。</li>
                          <li><strong>根(固定、吸收水分養分)：</strong>軸根(粗大主根深入土壤, 菠菜/莧菜)、鬚根(細小如鬚在淺層, 水稻/蔥/蒜)。</li>
                        </ul>
                      </div>
                    </div>
                  </div>

                  <div className="bg-white rounded-2xl border border-sky-200 shadow-md overflow-hidden">
                    <div className="bg-sky-500 text-white py-3 px-5">
                      <h3 className="text-xl font-black">🌸 單元二：花、果實與植物的功用</h3>
                    </div>
                    <div className="p-6 space-y-6 text-gray-800">
                      <div>
                        <h4 className="text-lg font-bold text-sky-800 mb-2 border-b border-sky-100 pb-1">1. 花的構造</h4>
                        <p className="text-sm mb-2"><strong>完全花</strong>包含以下四個構造 (缺少任何一個稱為不完全花)：</p>
                        <ul className="text-sm space-y-2">
                          <li><strong>花萼：</strong>最外圈，保護花蕊和花瓣。</li>
                          <li><strong>花瓣：</strong>最醒目，顏色豐富/散發氣味，吸引動物傳粉，保護雄雌蕊。</li>
                          <li><strong>雄蕊：</strong>數量較多，產生花粉。</li>
                          <li><strong>雌蕊：</strong>通常在中央，受粉後發育成長為「果實」。</li>
                        </ul>
                      </div>
                      <div>
                        <h4 className="text-lg font-bold text-sky-800 mb-2 border-b border-sky-100 pb-1">2. 果實與生活應用</h4>
                        <p className="text-sm bg-sky-50 p-3 rounded-lg mb-2"><strong>果實與種子：</strong>雌蕊發育成包含種子的果實。果實利用顏色或氣味吸引動物食用(如龍葵變紫色)，或是發展尖刺/羽絮狀，來傳播種子。</p>
                        <p className="text-sm bg-sky-50 p-3 rounded-lg"><strong>功用：</strong>水土保持、預防土石流、淨化空氣、提供森林浴。植物資源必須適當保護與使用，讓生命生生不息。</p>
                      </div>
                    </div>
                  </div>

                </section>

                <div className="text-center pb-8 pt-4">
                  <button 
                    onClick={() => window.location.reload()}
                    className="px-10 py-4 bg-gray-800 text-white font-black text-xl rounded-full shadow-xl hover:scale-105 transition-transform"
                  >
                    🔄 再玩一次
                  </button>
                </div>
              </div>
            </div>
          </div>
        );
      }

      return (
        <div className="h-full flex flex-col p-2 md:p-4 gap-4">
          
          <header className="flex-shrink-0 w-full bg-white rounded-xl shadow-sm p-3 flex justify-between items-center border-l-8 border-green-500">
            <h1 className="text-xl md:text-2xl font-black text-green-800 flex items-center">
              <span className="text-2xl mr-2 hidden md:inline">🌿</span> 植物大發現 - 探險大富翁
            </h1>
            <div className="flex items-center space-x-3">
              <div className="text-lg md:text-xl font-black text-yellow-700 bg-yellow-100 px-4 py-1.5 rounded-lg border border-yellow-300 flex items-center">
                🪙 <span className="ml-2">{coins}</span>
              </div>
              <div className="text-sm font-bold text-green-700 bg-green-100 px-3 py-1.5 rounded-lg border border-green-300">
                裝備: {inventory.length}/5
              </div>
            </div>
          </header>

          <main className="flex-1 flex flex-col lg:flex-row gap-4 min-h-0">
            
            <section className="w-full lg:w-2/3 h-full bg-green-700 p-2 md:p-3 rounded-2xl shadow-inner border-4 border-green-800 flex items-center justify-center relative overflow-hidden">
              <div className="w-full max-h-full aspect-[2/1] grid grid-cols-10 grid-rows-5 gap-1 bg-green-800 p-1 rounded-xl">
                
                <div 
                  className="flex flex-col items-center justify-center bg-[#f3f9f1]/95 rounded-xl m-2 border-4 border-dashed border-green-600/60 shadow-md relative"
                  style={{ gridColumn: '2 / 10', gridRow: '2 / 5' }}
                >
                  <div className="absolute top-2 w-full text-center px-4">
                    <p className="text-sm md:text-base font-bold text-blue-800 bg-blue-100 rounded-lg py-1 px-2 line-clamp-1">
                      {message}
                    </p>
                  </div>
                  
                  <div className={`w-20 h-20 md:w-28 md:h-28 bg-white rounded-2xl flex items-center justify-center text-5xl md:text-6xl font-black shadow-inner mb-3 border-4 border-gray-200 text-green-600 transition-transform ${isRolling ? 'animate-dice-shake' : ''}`}>
                    {diceResult ? diceResult : '？'}
                  </div>
                  
                  <button 
                    onClick={rollDice}
                    disabled={isRolling || isWalking || currentQuestion !== null || chanceEvent !== null || answerResult !== null || showShopPrompt}
                    className={`px-6 py-2 md:px-8 md:py-3 rounded-full font-black text-lg md:text-xl shadow-md transition-all active:scale-95 ${
                      isRolling || isWalking || currentQuestion !== null || chanceEvent !== null || answerResult !== null || showShopPrompt
                        ? 'bg-gray-300 text-gray-500 cursor-not-allowed' 
                        : 'bg-green-500 text-white hover:bg-green-600'
                    }`}
                  >
                    {isRolling ? '轉動中...' : isWalking ? '前進中...' : '🎲 擲骰子'}
                  </button>
                </div>

                {CELL_MAP.map((cell, index) => (
                  <div 
                    key={index} 
                    style={getCellGridStyle(index)}
                    className={`${cell.bg} rounded flex flex-col items-center justify-center border border-white/50 shadow-inner relative`}
                  >
                    <span className="text-[9px] font-bold hidden lg:block absolute top-0.5 opacity-70">{cell.label}</span>
                    <span className="text-xl md:text-3xl">{cell.icon}</span>
                    
                    {position === index && (
                      <div className={`absolute text-3xl md:text-4xl z-10 filter drop-shadow-md ${isWalking ? 'animate-bounce' : 'animate-pulse'}`}>
                        {isWalking ? '🏃' : '🚶'}
                      </div>
                    )}
                  </div>
                ))}
              </div>
            </section>

            <aside className="w-full lg:w-1/3 h-full flex flex-col gap-4 overflow-y-auto no-scrollbar">
              
              <div className="bg-white rounded-2xl shadow-sm p-4 border-t-8 border-yellow-400 flex-shrink-0">
                <h2 className="text-lg font-black text-yellow-700 mb-2 flex items-center">💡 探險任務</h2>
                <p className="text-sm text-gray-600 font-bold">
                  存滿 250 金幣，並在下方商店買齊 5 樣植物探險裝備即可過關領取講義！
                </p>
              </div>

              <div className={`bg-white rounded-2xl shadow-sm p-4 border-t-8 flex-1 flex flex-col transition-colors ${coins >= 250 && inventory.length < 5 ? 'border-yellow-400 bg-yellow-50' : 'border-indigo-400'}`}>
                <h2 className="text-lg font-black text-indigo-800 mb-1 flex items-center">🛒 裝備商店</h2>
                <div className="flex-1 overflow-y-auto no-scrollbar space-y-2 mt-2">
                  {EXPLORATION_SUPPLIES.map(item => {
                    const owned = inventory.includes(item.id);
                    const canAfford = coins >= item.cost;
                    return (
                      <div key={item.id} className={`flex items-center justify-between p-2.5 rounded-xl border-2 ${owned ? 'bg-gray-50 border-gray-200' : 'bg-indigo-50 border-indigo-100'}`}>
                        <div className="flex items-center space-x-2">
                          <span className="text-2xl">{item.icon}</span>
                          <div className="flex flex-col">
                            <span className={`font-black text-base ${owned ? 'text-gray-400 line-through' : 'text-gray-800'}`}>{item.name}</span>
                            <span className="text-[10px] text-gray-500 leading-tight hidden sm:block">{item.desc}</span>
                          </div>
                        </div>
                        {owned ? (
                          <span className="text-xs text-green-600 font-black bg-green-100 px-2 py-1 rounded">已擁有</span>
                        ) : (
                          <button 
                            onClick={() => buySupply(item)}
                            disabled={!canAfford || isWalking || isRolling}
                            className={`px-3 py-1.5 rounded-lg text-sm font-black shadow-sm ${canAfford && !isWalking && !isRolling ? 'bg-indigo-500 text-white hover:bg-indigo-600 active:scale-95' : 'bg-gray-200 text-gray-400 cursor-not-allowed'}`}
                          >
                            {item.cost} 🪙
                          </button>
                        )}
                      </div>
                    );
                  })}
                </div>
              </div>

            </aside>
          </main>

          {showShopPrompt && (
            <div className="fixed inset-0 bg-black/60 flex items-center justify-center p-4 z-50">
              <div className="bg-white rounded-3xl shadow-2xl max-w-sm w-full animate-zoom-in text-center p-8 border-t-[10px] border-yellow-400">
                <div className="text-6xl mb-3 animate-bounce">🎊</div>
                <h3 className="text-2xl font-black text-yellow-600 mb-3">金幣達標！</h3>
                <p className="text-base text-gray-700 font-bold mb-5 bg-yellow-50 p-4 rounded-xl border border-yellow-100">
                  太厲害了！你已經收集滿 <strong>250 枚金幣</strong>！快把商店裡的裝備全包了吧！
                </p>
                <button 
                  onClick={() => setShowShopPrompt(false)}
                  className="w-full py-3 bg-yellow-500 text-yellow-900 rounded-xl font-bold text-lg hover:bg-yellow-400 shadow-md active:scale-95 transition-transform"
                >
                  去商店大採購 🛒
                </button>
              </div>
            </div>
          )}

          {chanceEvent && (
            <div className="fixed inset-0 bg-black/60 flex items-center justify-center p-4 z-50">
              <div className="bg-white rounded-3xl shadow-2xl max-w-sm w-full animate-zoom-in text-center p-6 border-t-[10px] border-purple-500">
                <div className="text-5xl mb-3">🎁</div>
                <h3 className="text-2xl font-black text-purple-800 mb-3">機會命運</h3>
                <p className="text-base text-gray-700 font-bold mb-4 bg-purple-50 p-4 rounded-xl text-left leading-relaxed">
                  {chanceEvent.text}
                </p>
                <div className={`text-3xl font-black mb-6 ${chanceEvent.coins > 0 ? 'text-green-500' : 'text-red-500'}`}>
                  {chanceEvent.coins > 0 ? `+${chanceEvent.coins}` : chanceEvent.coins} 金幣
                </div>
                <button 
                  onClick={handleChanceClose}
                  className="w-full py-3 bg-purple-600 text-white rounded-xl font-bold text-lg hover:bg-purple-700 shadow-md active:scale-95 transition-transform"
                >
                  確定
                </button>
              </div>
            </div>
          )}

          {currentQuestion && (
            <div className="fixed inset-0 bg-black/60 flex items-center justify-center p-4 z-50">
              <div className="bg-white rounded-3xl shadow-2xl max-w-xl w-full flex flex-col max-h-[90vh] animate-zoom-in border-t-[10px] border-green-500 overflow-hidden">
                <div className="bg-green-100 px-5 py-3 flex justify-between items-center flex-shrink-0">
                  <h3 className="text-xl font-black text-green-800">📚 自然隨堂考</h3>
                  <span className="bg-yellow-400 text-yellow-900 px-3 py-1 rounded-full text-xs font-black shadow-sm">答對 +10 金幣</span>
                </div>
                <div className="p-6 overflow-y-auto no-scrollbar">
                  <p className="text-xl text-gray-800 font-bold mb-6 leading-snug">
                    {currentQuestion.text}
                  </p>
                  <div className="space-y-3">
                    {currentQuestion.options.map((option, index) => (
                      <button
                        key={index}
                        onClick={() => handleAnswer(index)}
                        className="w-full text-left p-4 rounded-xl border-2 border-gray-200 hover:border-green-400 hover:bg-green-50 transition-colors font-bold text-gray-700 text-base md:text-lg flex items-center group shadow-sm active:scale-95"
                      >
                        {currentQuestion.type === 'MC' && (
                          <span className="w-8 h-8 rounded-full bg-gray-200 text-gray-600 flex items-center justify-center mr-3 group-hover:bg-green-500 group-hover:text-white transition-colors flex-shrink-0 text-sm">
                            {String.fromCharCode(65 + index)}
                          </span>
                        )}
                        <span className={currentQuestion.type === 'TF' ? 'w-full text-center text-2xl' : 'flex-1 leading-tight'}>{option}</span>
                      </button>
                    ))}
                  </div>
                </div>
              </div>
            </div>
          )}

          {answerResult && (
            <div className="fixed inset-0 bg-black/60 flex items-center justify-center p-4 z-50">
              <div className={`bg-white rounded-3xl shadow-2xl max-w-lg w-full animate-zoom-in border-t-[10px] ${answerResult.isCorrect ? 'border-green-500' : 'border-red-500'} overflow-hidden`}>
                <div className={`px-5 py-3 flex justify-between items-center ${answerResult.isCorrect ? 'bg-green-100' : 'bg-red-100'}`}>
                  <h3 className={`text-xl font-black ${answerResult.isCorrect ? 'text-green-800' : 'text-red-800'}`}>
                    {answerResult.isCorrect ? '🎉 答對了！' : '❌ 答錯了...'}
                  </h3>
                  {answerResult.isCorrect && (
                    <span className="bg-yellow-400 text-yellow-900 px-3 py-1 rounded-full text-xs font-black shadow-sm">+{answerResult.coinsEarned} 金幣</span>
                  )}
                </div>
                <div className="p-6">
                  {!answerResult.isCorrect && (
                    <div className="bg-red-50 border border-red-200 p-4 rounded-xl mb-4">
                      <p className="text-red-800 font-bold mb-1 text-sm">💡 正確答案：</p>
                      <p className="text-lg font-black text-red-600 pl-2">{answerResult.correctAnswer}</p>
                    </div>
                  )}
                  <div className="bg-blue-50 border border-blue-200 p-4 rounded-xl mb-6">
                    <p className="text-blue-800 font-bold mb-1 text-sm">📖 重點解析：</p>
                    <p className="text-base text-gray-700 font-medium leading-relaxed pl-2">{answerResult.explanation}</p>
                  </div>
                  <button 
                    onClick={closeAnswerResult}
                    className={`w-full py-3 text-white rounded-xl font-bold text-lg shadow-md active:scale-95 transition-transform ${answerResult.isCorrect ? 'bg-green-600 hover:bg-green-700' : 'bg-red-600 hover:bg-red-700'}`}
                  >
                    繼續探險
                  </button>
                </div>
              </div>
            </div>
          )}
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
